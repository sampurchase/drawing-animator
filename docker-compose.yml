# Start:   docker compose up -d --build
# Stop:    docker compose down          (your drawings and videos stay in ./data)
# Logs:    docker compose logs -f
services:
  drawing-dance:
    build: .
    image: drawing-dance
    container_name: drawing-dance
    restart: unless-stopped
    ports:
      # Change the left number if 8080 is already used on this machine, e.g. "8090:8080"
      - "${DRAWINGS_HOST_PORT:-8080}:8080"
    volumes:
      # Everything the app saves lives here, so backing up this folder backs up the lot.
      # The app runs as user id 1000, so this folder should be owned by user id 1000 (usually the first user).
      - ./data:/data
    environment:
      # DRAWINGS_RENDER_WORKERS: "2"       # parallel frame workers, leave out for automatic
      DRAWINGS_MAX_UPLOAD_MB: "25"
      DRAWINGS_MAX_MUSIC_MB: "60"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
